plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Dev builds float on the newest RuneLite release (Board, 2026-11-14), the
// same 'latest.release' RuneLite's example-plugin template uses, so the dev
// client and the Plugin Hub plugins it loads are always the current ones.
// This only affects dev: the Plugin Hub replaces build.gradle at submission
// (build=standard) and builds against its own runelite.version.
// Trade-off: a RuneLite release can break this build on a day nothing in this
// repo changed. Pin one version to compare or bisect:
//   ./gradlew build -PruneLiteVersion=1.13.6
// Releases: https://repo.runelite.net/net/runelite/client/maven-metadata.xml
def runeLiteVersion = project.findProperty('runeLiteVersion') ?: 'latest.release'
def pluginMainClass = 'com.vinnyvangogh.combatvitals.CombatVitalsPluginTest'

// Re-check repo.runelite.net for a newer release on every run instead of
// Gradle's default 24h cache of dynamic versions. Only the RuneLite
// dependencies are dynamic, so in practice this scopes to them. --offline
// still resolves from the cache.
configurations.configureEach {
	resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.vinnyvangogh.combatvitals'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Says which RuneLite a run or test used, so a failure on a floating version
// names the release it failed against.
tasks.register('printRuneLiteVersion') {
	description = 'Prints the RuneLite client version this build resolved.'
	doLast {
		def client = configurations.testRuntimeClasspath.incoming.resolutionResult.allComponents.find {
			it.moduleVersion?.group == 'net.runelite' && it.moduleVersion?.name == 'client'
		}
		logger.lifecycle("RuneLite client: ${client?.moduleVersion?.version ?: 'not resolved'} (requested '${runeLiteVersion}')")
	}
}

tasks.named('test') {
	dependsOn 'printRuneLiteVersion'
	// The render and README shot tests draw to images, never to a screen,
	// so they pass on a machine or CI runner with no display.
	systemProperty 'java.awt.headless', 'true'
}

// Regenerates the README's overlay pictures in docs/images/generated from the
// plugin's own painters (ReadmeShotsTest). Dev-only: test code never reaches
// the Plugin Hub jar.
tasks.register('readmeShots', Test) {
	description = 'Redraws the README overlay screenshots into docs/images/generated.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter { includeTestsMatching 'com.vinnyvangogh.combatvitals.ReadmeShotsTest' }
	systemProperty 'java.awt.headless', 'true'
	systemProperty 'readme.shots.dir', file('docs/images/generated').absolutePath
	outputs.upToDateWhen { false }
}

// The sidebar panel's UI tests and screenshots drive Swing components
// directly (SwingDriver, copied from GIM Utilities): no display, no OS input.
tasks.named('test', Test) {
	systemProperty 'java.awt.headless', 'true'
}

// Renders the README's sidebar panel screenshots (VitalsSidePanelShots) into
// docs/images. ./gradlew test renders the same shots into build/screenshots.
tasks.register('screenshots', Test) {
	description = 'Renders the README sidebar panel screenshots into docs/images'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching 'com.vinnyvangogh.combatvitals.VitalsSidePanelShots'
	}
	systemProperty 'java.awt.headless', 'true'
	systemProperty 'screenshots.dir', file('docs/images').absolutePath
	outputs.upToDateWhen { false }
}

tasks.register('run', JavaExec) {
	dependsOn 'printRuneLiteVersion'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"

	// RuneLite's OSXFullScreenAdapter extends com.apple.eawt.FullScreenAdapter.
	// java.desktop stopped exporting com.apple.eawt to the unnamed module after
	// Java 8, so on macOS the developer client dies at startup with
	// IllegalAccessError unless the export is reopened. Dev-only: the Plugin Hub
	// packager replaces this file at submission because build=standard.
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}

	// RuneLite derives RUNELITE_DIR from user.home, so overriding it gives a
	// second client its own .runelite: separate credentials, config and probe
	// output. Needed to run two accounts at once for the cross-account health
	// correlation. Usage: ./gradlew run -PaltHome=/path/to/alt-home
	if (project.hasProperty('altHome')) {
		jvmArgs "-Duser.home=${project.altHome}"
	}

	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
