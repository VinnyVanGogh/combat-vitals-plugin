plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pinned rather than the template's 'latest.release'. The Plugin Hub manifest
// points at one commit of this repo, so the build that commit produces has to
// be reproducible; a floating dependency means a build that passed yesterday
// can fail today for reasons nothing in this repo changed. Check
// https://repo.runelite.net/net/runelite/client/maven-metadata.xml to bump.
def runeLiteVersion = '1.13.2'
def pluginMainClass = 'com.vinnyvangogh.combatvitals.CombatVitalsPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.vinnyvangogh.combatvitals'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"

	// RuneLite's OSXFullScreenAdapter extends com.apple.eawt.FullScreenAdapter.
	// java.desktop stopped exporting com.apple.eawt to the unnamed module after
	// Java 8, so on macOS the developer client dies at startup with
	// IllegalAccessError unless the export is reopened. Dev-only: the Plugin Hub
	// packager replaces this file at submission because build=standard.
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}

	// RuneLite derives RUNELITE_DIR from user.home, so overriding it gives a
	// second client its own .runelite: separate credentials, config and probe
	// output. Needed to run two accounts at once for the cross-account health
	// correlation. Usage: ./gradlew run -PaltHome=/path/to/alt-home
	if (project.hasProperty('altHome')) {
		jvmArgs "-Duser.home=${project.altHome}"
	}

	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
